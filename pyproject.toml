[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "conversor-de-bases"
version = "1.0.0"
description = "Conversor desktop determinístico e auditável para layouts ERP"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "openpyxl>=3.1.5,<4", "xlrd>=2.0.1,<3", "charset-normalizer>=3.4,<4", "httpx>=0.28,<1", "keyring>=25,<26"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.16", "ruff>=0.11"]

[project.scripts]
conversor = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["core/rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
