name: Validar e empacotar
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bibliotecas Qt Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
      - run: python -m pip install -e ".[dev]"
      - run: python -c "from pathlib import Path; Path('.local').mkdir(exist_ok=True)"
      - run: python -m pytest --basetemp=.local/test-tmp -q
      - run: python -m ruff check app scripts tests
      - run: python run.py --self-test --self-test-report .local/source-selftest.json
      - run: python scripts/build.py
      - name: Instalar compilador NSIS no Windows
        if: runner.os == 'Windows'
        run: choco install nsis --version=3.11 -y --no-progress
      - name: Criar e validar instalador Windows nativo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/Transmute-*-Windows-*.zip | Select-Object -First 1
          python scripts/package_installers.py --windows-zip $zip.FullName --makensis "C:\Program Files (x86)\NSIS\makensis.exe"
          $exe = Get-ChildItem dist/releases/*/*Setup.exe | Select-Object -First 1
          python scripts/validate_installer.py $exe.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: conversor-${{ runner.os }}
          path: |
            dist/*.zip
            dist/releases/**/*.exe
            dist/windows-native.png
